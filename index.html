<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SL TV - Multi Channel</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        #player-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-container { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: rgba(0,0,0,0.85); z-index: 10; box-sizing: border-box; transition: transform 0.3s; }
        .hidden { transform: translateY(100%); }
        #toggle-ui { position: absolute; bottom: 10px; right: 10px; z-index: 20; background: #333; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 5px; opacity: 0.5; }
        #toggle-ui:hover { opacity: 1; }
        input, button { padding: 8px; margin: 2px; font-size: 14px; }
        .btn { cursor: pointer; background: #444; color: white; border: none; border-radius: 4px; }
        .btn:hover { background: #555; }
        .btn-danger { background: #d32f2f; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-sync { background: #3b82f6; font-weight: bold; }
        .btn-sync:hover { background: #2563eb; }
        
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; display: flex; align-items: center; justify-content: center; z-index: 50; cursor: pointer; font-size: 24px; font-weight: bold; }
        #overlay.hidden { display: none; }
        
        .list-container { max-height: 180px; overflow-y: auto; background: #222; padding: 10px; border-radius: 4px; margin-top: 10px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 6px; border-bottom: 1px solid #444; font-size: 13px; }
        .list-item:hover { background: #333; }

        .video-thumb-title { display: flex; align-items: center; cursor: pointer; flex: 1; overflow: hidden; text-align: left; background: none; border: none; color: white; padding: 0; }
        .video-thumb-title img { width: 50px; height: 30px; object-fit: cover; border-radius: 3px; margin-right: 8px; flex-shrink: 0; }
        .video-thumb-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .playlist-active-container { background: #222; border-radius: 4px; margin-top: 10px; overflow: hidden; font-family: sans-serif; border: 1px solid #444; }
        .playlist-active-header { padding: 10px 12px; background: #2a2a2a; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 13px; }
        .playlist-active-header:hover { background: #333; }
        .playlist-active-header::after { content: '▼'; font-size: 10px; transition: transform 0.3s; margin-left: 10px; }
        .playlist-active-container.open .playlist-active-header::after { transform: rotate(180deg); }
        .playlist-items-list { max-height: 0; overflow-y: auto; transition: max-height 0.3s ease-out; background: #1a1a1a; }
        .playlist-active-container.open .playlist-items-list { max-height: 184px; }
        
        .channel-info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="overlay" onclick="startInteraction()">Haz clic aquí para activar la Pantalla</div>
    <div class="channel-info" id="channelDisplay">Canal: ...</div>
    <div id="player-container"></div>

    <button id="toggle-ui" onclick="toggleUI()">Quitar HUD</button>

    <div id="ui-container" class="hidden">
        <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center;">
            <input type="text" id="urlInput" placeholder="URL YouTube, Twitch, .mp4 o película..." style="flex: 1;">
            <button class="btn" onclick="addUrl()">Añadir a la Lista</button>
            <button class="btn btn-danger" onclick="clearAll()">Limpiar Todo</button>
            <button class="btn btn-sync" onclick="forzarSincronizacion()">🔄 Sincronizar video</button>
            
            <label for="volSlider" style="margin-left: 10px; font-weight: bold;">Volumen:</label>
            <input type="range" id="volSlider" min="0" max="100" value="50" oninput="cambiarVolumen()" style="width: 100px; cursor: pointer;">
        </div>

        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <h4>Lista De Videos: </h4>
                <div id="queueList" class="list-container"></div>
            </div>
            <div style="flex: 1;">
                <h4>Playlist de youtube: </h4>
                <input type="text" id="basePlaylistInput" placeholder="ID de Lista de YouTube (Ej: PL...)" style="width: calc(100% - 80px);">
                <button class="btn" onclick="setBasePlaylist()">Agregar</button>
                <div id="baseList" class="list-container"></div>
            </div>
        </div>
    </div>

<script>
// ================= CONFIGURACIÓN FIREBASE =================
const firebaseConfig = {
    databaseURL: "https://sl-tv-sync-default-rtdb.firebaseio.com/" 
};
firebase.initializeApp(firebaseConfig);

const urlParams = new URLSearchParams(window.location.search);
const channelName = urlParams.get('channel') || 'canal_por_defecto';
document.getElementById('channelDisplay').innerText = `Canal: ${channelName}`;

const dbRef = firebase.database().ref(channelName);

// ================= VARIABLES GLOBALES =================
let ytPlayer;
let isPlayerReady = false;
let currentMedia = null; 
let interactionDone = false;

// ================= INTERACCIÓN INICIAL (AUTOPLAY FIX) =================
function startInteraction() {
    interactionDone = true;
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('ui-container').classList.remove('hidden');
    
    ytPlayer = new YT.Player('player-container', {
        height: '100%', width: '100%', videoId: '',
        playerVars: { 'autoplay': 1, 'controls': 0, 'rel': 0 },
        events: { 'onReady': onPlayerReady, 'onStateChange': onStateChange }
    });
}

function toggleUI() {
    const ui = document.getElementById('ui-container');
    ui.classList.toggle('hidden');
}

function onPlayerReady(event) {
    isPlayerReady = true;
    const volInicial = document.getElementById('volSlider').value;
    ytPlayer.setVolume(volInicial);
    listenFirebase();
}

// ================= LÓGICA DE FIREBASE =================
function listenFirebase() {
    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        updateUI(data);

        let mediaToPlay = null;
        let isYtPlaylist = false;
        let ytIdx = 0;

        if (data.playlist && data.playlist.length > 0) {
            mediaToPlay = data.playlist[0]; 
        } else if (data.basePlaylistId && !data.baseFinished) {
            mediaToPlay = data.basePlaylistId; 
            isYtPlaylist = true;
            ytIdx = data.basePlaylistIndex || 0;
        }

        if (mediaToPlay !== currentMedia) {
            currentMedia = mediaToPlay;
            loadMedia(mediaToPlay, isYtPlaylist, ytIdx);
        }
    });
}

// ================= PARSER Y REPRODUCCIÓN MULTIMEDIA =================
function parseEmbedURL(url) {
    let match;
    match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/);
    if (match) return { type: 'youtube', id: match[1] };
    
    match = url.match(/twitch\.tv\/([^&]+)/);
    if (match) return { type: 'twitch', url: `https://player.twitch.tv/?channel=${match[1]}&parent=${window.location.hostname}&autoplay=true` };
    
    if (url.match(/\.(mp4|webm|ogv)$/i)) return { type: 'direct_video', url: url };
    
    return { type: 'iframe_full', url: url };
}

function loadMedia(urlOrId, isYtPlaylist, index) {
    if (!interactionDone) return;
    const container = document.getElementById('player-container');
    
    if (isYtPlaylist) {
        if(ytPlayer && ytPlayer.loadPlaylist) {
            ytPlayer.loadPlaylist({ list: urlOrId, index: index, startSeconds: 0 });
        }
    } else {
        const parsed = parseEmbedURL(urlOrId);
        if (parsed.type === 'youtube') {
            if(ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(parsed.id);
            }
        } else if (parsed.type === 'direct_video') {
            container.innerHTML = `<video src="${parsed.url}" width="100%" height="100%" controls autoplay style="background:black;"></video>`;
        } else {
            container.innerHTML = `<iframe src="${parsed.url}" width="100%" height="100%" frameborder="0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" sandbox="allow-forms allow-scripts allow-pointer-lock allow-same-origin allow-top-navigation"></iframe>`;
        }
    }
}

// ================= EVENTOS YOUTUBE =================
function onStateChange(event) {
    if (event.data === YT.PlayerState.ENDED) {
        dbRef.once('value').then(snapshot => {
            const data = snapshot.val();
            if (data.playlist && data.playlist.length > 0) {
                nextQueueItem();
            } else if (data.basePlaylistId) {
                let currentYtIndex = ytPlayer.getPlaylistIndex();
                nextBaseVideo(currentYtIndex + 1);
            }
        });
    }
}

// ================= SINCRONIZACIÓN MANUAL =================
function forzarSincronizacion() {
    if (!ytPlayer || typeof ytPlayer.seekTo !== 'function') {
        alert("La sincronización manual solo está disponible para videos de YouTube.");
        return;
    }
    
    dbRef.once('value').then((snapshot) => {
        const data = snapshot.val();
        if (data && data.tiempoInicio) {
            let tiempoTranscurrido = (Date.now() - data.tiempoInicio) / 1000;
            ytPlayer.seekTo(tiempoTranscurrido, true);
            ytPlayer.playVideo();
        } else {
            alert("No hay datos de tiempo guardados. Reinicia el video para activar la sincronización.");
        }
    });
}

// ================= CONTROL DE VOLUMEN LOCAL =================
function cambiarVolumen() {
    const vol = document.getElementById('volSlider').value;
    if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
        ytPlayer.setVolume(vol);
    }
}

// ================= CONTROLADORES DE DATOS FIREBASE =================
function addUrl() {
    const input = document.getElementById('urlInput').value.trim();
    if (!input) return;
    
    dbRef.child('playlist').once('value').then(snap => {
        let queue = snap.val() || [];
        queue.push(input);
        dbRef.child('playlist').set(queue);
    });
    document.getElementById('urlInput').value = '';
}

function setBasePlaylist() {
    const input = document.getElementById('basePlaylistInput').value.trim();
    const match = input.match(/[?&]list=([^&]+)/) || [null, input];
    
    if (match[1]) {
        dbRef.update({
            basePlaylistId: match[1], 
            basePlaylistIndex: 0, 
            baseFinished: false,
            tiempoInicio: Date.now() 
        });
    }
    document.getElementById('basePlaylistInput').value = '';
}

function nextBaseVideo(newIndex) {
    dbRef.transaction(data => {
        if (data) {
            data.basePlaylistIndex = newIndex;
            data.tiempoInicio = Date.now(); 
        }
        return data;
    });
}

function nextQueueItem() {
    dbRef.transaction(data => {
        if (!data) return data;
        
        if (data.playlist && data.playlist.length > 0) {
            data.playlist.shift();
            data.tiempoInicio = Date.now(); 
        }
        if (!data.playlist || data.playlist.length === 0) {
            data.baseFinished = false; 
            data.tiempoInicio = Date.now(); 
        }
        return data;
    });
}

function clearAll() {
    dbRef.set({ 
        basePlaylistId: "", 
        basePlaylistIndex: 0, 
        baseFinished: false, 
        playlist: [],
        tiempoInicio: Date.now() 
    });
}

function removeQueueItem(index) {
    dbRef.child('playlist').transaction(queue => {
        if (queue) queue.splice(index, 1);
        return queue;
    });
}

function selectQueueItem(index) {
    dbRef.transaction(data => {
        if (!data) return data;
        data.baseFinished = true; 
        if (data.playlist) data.playlist = data.playlist.slice(index);
        data.tiempoInicio = Date.now(); 
        return data;
    });
}

// ================= AUXILIARES DE INTERFAZ =================
function extraerInfoYoutube(url) {
    let match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/);
    if (match) {
        return {
            thumb: `https://img.youtube.com/vi/${match[1]}/mqdefault.jpg`,
            title: url
        };
    }
    return {
        thumb: 'https://via.placeholder.com/50x30?text=Web',
        title: url
    };
}

function toggleAcordeonPlaylist() {
    const acordeon = document.getElementById('acordeonPlaylist');
    if (acordeon) acordeon.classList.toggle('open');
}

// ================= RENDERIZADO DE INTERFAZ (UI) =================
function updateUI(data) {
    const queueList = document.getElementById('queueList');
    queueList.innerHTML = '';
    
    if (data.playlist && data.playlist.length > 0) {
        data.playlist.forEach((item, idx) => {
            let info = extraerInfoYoutube(item);
            queueList.innerHTML += `
                <div class="list-item">
                    <button class="video-thumb-title" onclick="selectQueueItem(${idx})">
                        <img src="${info.thumb}" alt="Miniatura">
                        <span>${idx + 1}. ${info.title}</span>
                    </button>
                    <button class="btn btn-danger" onclick="removeQueueItem(${idx})" style="padding: 2px 6px; font-size:11px;">X</button>
                </div>
            `;
        });
    } else {
        queueList.innerHTML = '<div style="padding: 5px; font-size: 12px; color: #888;">La lista está vacía.</div>';
    }

    const baseList = document.getElementById('baseList');
    if (data.basePlaylistId) {
        let indiceActual = data.basePlaylistIndex || 0;
        let itemsSimuladosHtml = '';
        
        if (ytPlayer && typeof ytPlayer.getPlaylist === 'function') {
            let playlistIds = ytPlayer.getPlaylist();
            if (playlistIds && playlistIds.length > 0) {
                playlistIds.forEach((vId, i) => {
                    itemsSimuladosHtml += `
                        <div class="list-item" style="border-bottom: 1px solid #222;">
                            <div class="video-thumb-title" style="cursor:default;">
                                <img src="https://img.youtube.com/vi/${vId}/mqdefault.jpg" alt="Mini">
                                <span style="${i === indiceActual ? 'color: #3b82f6; font-weight: bold;' : ''}">[${i}] ID: ${vId}</span>
                            </div>
                        </div>
                    `;
                });
            } else {
                itemsSimuladosHtml = `<div style="padding: 8px; font-size: 12px; color: #aaa;">Reproduciendo desde YouTube (Índice: ${indiceActual})</div>`;
            }
        } else {
            itemsSimuladosHtml = `<div style="padding: 8px; font-size: 12px; color: #aaa;">Playlist ID: ${data.basePlaylistId} (Índice: ${indiceActual})</div>`;
        }

        baseList.innerHTML = `
            <div class="playlist-active-container" id="acordeonPlaylist">
                <div class="playlist-active-header" onclick="toggleAcordeonPlaylist()">
                    <span>Playlist Activa (Índice: ${indiceActual})</span>
                </div>
                <div class="playlist-items-list">
                    ${itemsSimuladosHtml}
                </div>
            </div>
        `;
    } else {
        baseList.innerHTML = '<div style="font-size: 13px; color: #888;">Playlist no configurada.</div>';
    }
}
</script>
</body>
</html>
