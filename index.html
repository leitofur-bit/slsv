<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SL Universal TV - Clean Queue</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #000000; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
            font-family: 'Poppins', sans-serif; 
            cursor: default;
        }
        
        #media-container { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 18px;
        }
        
        #media-container iframe { 
            width: 100% !important; 
            height: 100% !important; 
            position: absolute; 
            top: 0; 
            left: 0; 
            border: none;
        }
        
        #controls { 
            position: absolute; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 10; 
            background: rgba(18, 18, 20, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px; 
            border-radius: 14px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease, transform 0.4s ease;
            transform: translateX(-50%) translateY(10px);
        }

        #controls.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        #controls input { 
            padding: 10px 14px; 
            width: 280px; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(0, 0, 0, 0.5); 
            color: #fff; 
            font-size: 14px; 
            font-family: 'Poppins', sans-serif;
            outline: none; 
        }

        #controls input:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .btn { 
            padding: 10px 14px; 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px; 
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover { 
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            transform: translateY(-1px);
        }

        #playlist-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 15;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 13px;
        }

        #sidebar {
            position: absolute;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(12, 12, 15, 0.92);
            backdrop-filter: blur(16px);
            z-index: 25;
            box-shadow: -10px 0 30px rgba(0,0,0,0.7);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: right 0.4s cubic-bezier(0.1, 1, 0.1, 1);
            padding: 20px;
            box-sizing: border-box;
        }

        #sidebar.open { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
            color: #fff;
        }

        .close-btn { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 20px; cursor: pointer; }

        #queue-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .queue-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            font-size: 12px;
            border: 1px solid transparent;
        }
        .queue-item:hover { background: rgba(255, 255, 255, 0.1); border-color: #3b82f6; }
        .queue-item.active { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }

        #overlay { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 30; 
            background: rgba(5, 5, 5, 0.95); 
            backdrop-filter: blur(8px);
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            text-align: center; 
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="activatePlayer()">
        <h2>Haz clic aquí para activar la Pantalla</h2>
        <p>Habilita el sonido y la sincronización</p>
    </div>
    
    <div id="media-container">Pantalla en espera...</div>

    <button id="playlist-toggle" onclick="toggleSidebar()">📺 Cola / Enlaces</button>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3>Elementos en Cola</h3>
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <div id="queue-list"></div>
        <div style="padding-top:15px; border-top:1px solid rgba(255,255,255,0.1); display: flex; gap: 8px;">
            <button class="btn" onclick="nextVideo()" style="flex: 1; background: #10b981;">Siguiente ⏭</button>
            <button class="btn" onclick="clearQueue()" style="flex: 1; background: #ef4444;">Apagar TV</button>
        </div>
    </div>

    <div id="controls">
        <input type="text" id="urlInput" placeholder="Pega link de YT, FB, Twitch, Spotify..." />
        <button class="btn" onclick="addToQueue()">Agregar</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sl-tv-sync-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('tv');

        var isActivated = false;
        var currentURL = "";

        function activatePlayer() {
            isActivated = true;
            document.getElementById('overlay').style.display = 'none';
            listenFirebase();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function initUIControls() {
            const controls = document.getElementById('controls');
            let hideTimeout;

            window.addEventListener('mousemove', () => {
                controls.classList.add('visible');
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    if (!controls.matches(':hover')) controls.classList.remove('visible');
                }, 3500);
            });
        }
        initUIControls();

        function parseEmbedURL(input) {
            if (!input) return "";
            input = input.trim();

            // 1. YouTube
            let ytMatch = input.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            if (ytMatch && ytMatch[1]) {
                return "YT:" + ytMatch[1];
            }

            // 2. Facebook Videos
            if (input.includes("facebook.com") || input.includes("fb.watch")) {
                let targetUrl = input;
                try {
                    let urlObj = new URL(input);
                    if (urlObj.searchParams.has("v")) {
                        targetUrl = `https://www.facebook.com/watch/?v=${urlObj.searchParams.get("v")}`;
                    } else {
                        targetUrl = urlObj.origin + urlObj.pathname;
                    }
                } catch (e) {
                    targetUrl = input.split("?")[0];
                }

                return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(targetUrl)}&show_text=false&autoplay=true`;
            }

            // 3. Twitch
            let twitchMatch = input.match(/twitch\.tv\/([a-zA-Z0-9_]+)/);
            if (twitchMatch && twitchMatch[1]) {
                let currentDomain = window.location.hostname || "localhost";
                return `https://player.twitch.tv/?channel=${twitchMatch[1]}&parent=${currentDomain}&autoplay=true`;
            }

            // 4. Vimeo
            let vimeoMatch = input.match(/vimeo\.com\/(\d+)/);
            if (vimeoMatch && vimeoMatch[1]) {
                return `https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1`;
            }

            // 5. Spotify
            let spotifyMatch = input.match(/spotify\.com\/(track|album|playlist)\/([a-zA-Z0-9]+)/);
            if (spotifyMatch) {
                return `https://open.spotify.com/embed/${spotifyMatch[1]}/${spotifyMatch[2]}`;
            }
            
            // 6. SoundCloud
            if (input.includes("soundcloud.com")) {
                return `https://w.soundcloud.com/player/?url=${encodeURIComponent(input)}&auto_play=true`;
            }

            // 7. Páginas web generales
            if (input.startsWith("http://") || input.startsWith("https://")) {
                return input;
            }

            return "";
        }

        function addToQueue() {
            let val = document.getElementById('urlInput').value;
            let embedUrl = parseEmbedURL(val);

            if (!embedUrl) {
                alert("Enlace no compatible o inválido.");
                return;
            }

            dbRef.once('value', (snapshot) => {
                const data = snapshot.val() || {};
                let playlist = data.playlist || [];

                playlist.push(embedUrl);

                dbRef.update({ 
                    playlist: playlist 
                });
                document.getElementById('urlInput').value = "";
            });
        }

        function nextVideo() {
            dbRef.once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || !data.playlist || data.playlist.length === 0) return;
                
                let playlist = data.playlist;
                playlist.shift(); 

                dbRef.set({ 
                    playlist: playlist 
                });
            });
        }

        function selectItem(index) {
            dbRef.once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || !data.playlist) return;
                let playlist = data.playlist;
                let newPlaylist = playlist.slice(index);
                dbRef.set({ playlist: newPlaylist });
            });
        }

        function clearQueue() {
            dbRef.set({
                playlist: []
            });
        }

        function listenFirebase() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || !isActivated) return;

                const playlist = data.playlist || [];

                const listEl = document.getElementById('queue-list');
                listEl.innerHTML = "";

                playlist.forEach((item, idx) => {
                    let div = document.createElement('div');
                    div.className = `queue-item ${idx === 0 ? 'active' : ''}`;
                    div.onclick = () => selectItem(idx);
                    div.innerHTML = `<b>#${idx + 1}</b><br><span style="word-break:break-all;">${item}</span>`;
                    listEl.appendChild(div);
                });

                const container = document.getElementById('media-container');

                if (playlist.length === 0) {
                    currentURL = "";
                    container.innerHTML = "Pantalla en espera...";
                    return;
                }

                const targetItem = playlist[0];
                if (targetItem && targetItem !== currentURL) {
                    currentURL = targetItem;
                    loadMedia(currentURL);
                }
            });
        }

        function loadMedia(item) {
            const container = document.getElementById('media-container');
            
            if (item.startsWith("YT:")) {
                let videoId = item.replace("YT:", "");
                // Usamos un iframe directo en lugar de la API JS que impone el bloqueo estricto de edad
                container.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&controls=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
            } else {
                container.innerHTML = `<iframe src="${item}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
            }
        }
    </script>
</body>
</html>
