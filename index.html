<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Smart TV - Media Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: radial-gradient(circle at center, #1a1c29 0%, #08090d 100%); font-family: 'Segoe UI', Arial, sans-serif; color: white; overflow: hidden; }

        /* HEADER */
        .top-bar { position: absolute; top: 0; left: 0; width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 50; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); pointer-events: auto; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 2px; color: #fff; }
        .logo span { color: #ff3b30; }
        .top-right { display: flex; align-items: center; gap: 15px; font-size: 14px; font-weight: 600; }

        .btn-exit-player { background: #ff3b30; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; box-shadow: 0 4px 10px rgba(255,59,48,0.5); transition: transform 0.2s; display: none; }
        .btn-exit-player:hover { transform: scale(1.08); }

        /* DASHBOARD */
        #dashboard { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 80px 50px 40px 50px; z-index: 10; transition: opacity 0.4s; }
        #dashboard.hidden { opacity: 0; pointer-events: none; }

        .app-grid { display: flex; gap: 25px; align-items: center; margin-top: 20px; }
        .news-card { width: 320px; height: 200px; background: #222 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600') center/cover; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .news-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
        .news-card * { position: relative; z-index: 2; }
        .badge { background: #ff9500; color: #000; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; align-self: flex-start; margin-bottom: 8px; text-transform: uppercase; }
        .news-title { font-size: 15px; font-weight: 700; line-height: 1.3; }

        /* TARJETAS DE APPS */
        .app-card { 
            width: 160px; 
            height: 200px; 
            border-radius: 24px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); 
            border: 2px solid transparent; 
            position: relative; 
            overflow: hidden; 
            background-color: #111;
        }

        .app-card img.app-icon { 
            width: 75px; 
            height: 75px; 
            object-fit: contain; 
            position: relative; 
            z-index: 3; 
            transition: transform 0.3s;
        }

        /* CAPA DEL GIF DE FONDO */
        .preview-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            z-index: 1;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: scale(1.1);
        }

        /* CAPA DE COLOR BASE */
        .bg-youtube::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #ff0000, #800000); z-index: 2; transition: opacity 0.3s; }
        .bg-twitch::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #9146ff, #4b1b96); z-index: 2; transition: opacity 0.3s; }
        .bg-movies::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #ff2d55, #8e001a); z-index: 2; transition: opacity 0.3s; }
        .bg-browser::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #007aff, #004080); z-index: 2; transition: opacity 0.3s; }

        /* EFECTO HOVER */
        .app-card:hover { 
            transform: translateY(-12px) scale(1.08); 
            border-color: rgba(255,255,255,0.9); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .app-card:hover img.app-icon {
            transform: scale(1.15);
        }

        .app-card:hover::before {
            opacity: 0;
        }

        .app-card:hover .preview-bg {
            opacity: 1;
            transform: scale(1);
        }

        /* URLS DE PREVISUALIZACION */
        .yt-preview { background-image: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z2N3J3eXk0bnRsbW1mZmx6ZnR0YmU3bnptMmEwbXlsOHBneCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l41K3o5TzDQByEYxy/giphy.gif'); }
        .twitch-preview { background-image: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGcxcnptb3BhNGdqMnlmcjVsZmNqOHFsdmdxbXZ3enpsb3pxNmY5dyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/13Hgw8T855C208/giphy.gif'); }
        .movies-preview { background-image: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z6cWNkNmpscnQ3ZmFsZGV5cGtrZnN2ZnR2Ym4wZmllNm4zcmlhYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7rc0qU6b5hne8pps/giphy.gif'); }
        .browser-preview { background-image: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExejE2czFndW03dzRzb24wbTBxZXRiaGZidWV6NXByaWhkMmNmbmIydCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xT9IgzoKnwFNmISR8I/giphy.gif'); }

        .bottom-nav { margin-top: 40px; display: flex; gap: 15px; }
        .nav-btn { background: rgba(255,255,255,0.1); padding: 12px 28px; border-radius: 30px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }

        /* VISTAS APPS */
        .app-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; background: #0f0f12; padding: 90px 40px 30px 40px; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .app-view.active { opacity: 1; pointer-events: auto; }

        .search-bar { display: flex; gap: 12px; margin-bottom: 25px; }
        .search-input { flex: 1; padding: 14px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: white; font-size: 16px; outline: none; }
        .btn-app { padding: 14px 28px; border-radius: 30px; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-yt-color { background: #ff0000; }
        .btn-twitch-color { background: #9146ff; }
        .btn-browser-color { background: #007aff; }
        .btn-back { background: rgba(255,255,255,0.2); }
        .btn-back:hover { background: rgba(255,255,255,0.4); }

        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; overflow-y: auto; flex: 1; padding-bottom: 20px; }
        .media-card { background: rgba(255,255,255,0.05); border-radius: 16px; overflow: hidden; cursor: pointer; border: 2px solid transparent; position: relative; }
        .media-card:hover { transform: translateY(-5px); border-color: #fff; }
        .media-thumb { width: 100%; height: 125px; object-fit: cover; }
        .media-info { padding: 12px; }
        .media-title { font-size: 13px; font-weight: 700; height: 34px; overflow: hidden; }

        /* REPRODUCTOR */
        #media-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; background: #000; display: none; }
        #media-screen.active { display: block; z-index: 25; }
        #media-screen iframe, #media-screen video { width: 100%; height: 100%; border: none; }

        /* HUD OVERLAY */
        #ui-hud { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); z-index: 60; display: flex; gap: 10px; align-items: center; }
        #ui-hud.hidden { display: none; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: none; background: rgba(255,255,255,0.15); color: white; font-size: 14px; outline: none; }
        .btn-act { padding: 12px 20px; border-radius: 8px; border: none; background: #007aff; color: white; font-weight: bold; cursor: pointer; }

        #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; font-weight: bold; }
        #start-overlay.hidden { display: none; }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="initApp()">Haz clic para Encender la TV</div>

    <!-- HEADER -->
    <div class="top-bar">
        <div class="logo">MEDIA<span>SL</span></div>
        <div class="top-right">
            <button id="exitBtn" class="btn-exit-player" onclick="showDashboard()">◀ VOLVER AL MENÚ</button>
            <span id="channelNameDisplay">Canal: ...</span>
            <span id="clockDisplay">00:00 PM</span>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard">
        <div class="app-grid">
            <div class="news-card">
                <span class="badge">Novedades SL</span>
                <div class="news-title">Bienvenido a MediaSL Smart TV System</div>
            </div>

            <!-- YOUTUBE -->
            <div class="app-card bg-youtube" onclick="openYouTubeApp()">
                <div class="preview-bg yt-preview"></div>
                <img class="app-icon" src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube">
            </div>

            <!-- TWITCH -->
            <div class="app-card bg-twitch" onclick="openTwitchApp()">
                <div class="preview-bg twitch-preview"></div>
                <img class="app-icon" src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Twitch_Glitch_Logo_Purple.svg" alt="Twitch">
            </div>

            <!-- CINE -->
            <div class="app-card bg-movies" onclick="openMoviesApp()">
                <div class="preview-bg movies-preview"></div>
                <img class="app-icon" src="https://cdn-icons-png.flaticon.com/512/3172/3172520.png" alt="Peliculas">
            </div>

            <!-- BROWSER -->
            <div class="app-card bg-browser" onclick="openBrowserApp()">
                <div class="preview-bg browser-preview"></div>
                <img class="app-icon" src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" alt="Browser">
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-btn" onclick="showDashboard()">INICIO</div>
            <div class="nav-btn" onclick="toggleHUD()">PEGAR URL MANUAL</div>
        </div>
    </div>

    <!-- YOUTUBE APP VIEW -->
    <div id="youtube-app" class="app-view">
        <div class="search-bar">
            <button class="btn-app btn-back" onclick="closeAppView()">◀ Menú</button>
            <input type="text" id="ytQuery" class="search-input" placeholder="Buscar videos en YouTube..." onkeydown="if(event.key==='Enter') searchYouTube()">
            <button class="btn-app btn-yt-color" onclick="searchYouTube()">Buscar</button>
        </div>
        <div id="ytResults" class="media-grid"></div>
    </div>

    <!-- TWITCH APP VIEW -->
    <div id="twitch-app" class="app-view">
        <div class="search-bar">
            <button class="btn-app btn-back" onclick="closeAppView()">◀ Menú</button>
            <input type="text" id="twitchQuery" class="search-input" placeholder="Buscar streamer..." onkeydown="if(event.key==='Enter') searchTwitch()">
            <button class="btn-app btn-twitch-color" onclick="searchTwitch()">Buscar Streamer</button>
        </div>
        <div id="twitchResults" class="media-grid"></div>
    </div>

    <!-- BROWSER APP VIEW -->
    <div id="browser-app" class="app-view">
        <div class="search-bar">
            <button class="btn-app btn-back" onclick="closeAppView()">◀ Menú</button>
            <input type="text" id="webQuery" class="search-input" placeholder="Escribe una URL o busca en la Web (ej: wikipedia.org)..." onkeydown="if(event.key==='Enter') launchWebSearch()">
            <button class="btn-app btn-browser-color" onclick="launchWebSearch()">Navegar</button>
        </div>
    </div>

    <!-- REPRODUCTOR DE VIDEO / WEBS -->
    <div id="media-screen"></div>

    <!-- HUD OVERLAY -->
    <div id="ui-hud" class="hidden">
        <input type="text" id="urlInput" placeholder="Pega enlace de YouTube, Twitch, MP4 o Web...">
        <button class="btn-act" onclick="sendURL()">Reproducir</button>
        <button class="btn-act" style="background: #34c759;" onclick="showDashboard()">Ir al Menú</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://sl-tv-sync-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);

        const channel = new URLSearchParams(window.location.search).get('channel') || 'canal_default';
        document.getElementById('channelNameDisplay').innerText = `Canal: ${channel}`;
        const dbRef = firebase.database().ref(channel);

        function initApp() {
            document.getElementById('start-overlay').classList.add('hidden');
            updateClock();
            setInterval(updateClock, 1000);
            listenFirebase();
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clockDisplay').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function listenFirebase() {
            dbRef.on('value', snap => {
                const data = snap.val();
                if (!data) return;
                
                if (data.currentUrl === 'home' || !data.currentUrl) {
                    renderDashboardView();
                } else {
                    renderPlayerView(data.currentUrl, data.timestamp);
                }
            });
        }

        function renderDashboardView() {
            const screen = document.getElementById('media-screen');
            screen.innerHTML = '';
            screen.classList.remove('active');
            
            document.getElementById('youtube-app').classList.remove('active');
            document.getElementById('twitch-app').classList.remove('active');
            document.getElementById('browser-app').classList.remove('active');
            document.getElementById('ui-hud').classList.add('hidden');
            document.getElementById('exitBtn').style.display = 'none';

            document.getElementById('dashboard').classList.remove('hidden');
        }

        function renderPlayerView(url, timestamp) {
            const screen = document.getElementById('media-screen');
            
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('youtube-app').classList.remove('active');
            document.getElementById('twitch-app').classList.remove('active');
            document.getElementById('browser-app').classList.remove('active');
            document.getElementById('ui-hud').classList.add('hidden');

            document.getElementById('exitBtn').style.display = 'inline-block';
            screen.classList.add('active');

            let startSeconds = 0;
            if (timestamp) {
                startSeconds = Math.floor((Date.now() - timestamp) / 1000);
                if (startSeconds < 0) startSeconds = 0;
            }

            if (url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/)) {
                const videoId = RegExp.$1;
                screen.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&start=${startSeconds}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
            } 
            else if (url.match(/twitch\.tv\/([^&]+)/)) {
                const channelName = RegExp.$1;
                const domain = window.location.hostname || 'localhost';
                screen.innerHTML = `<iframe src="https://player.twitch.tv/?channel=${channelName}&parent=${domain}&autoplay=true" allowfullscreen></iframe>`;
            } 
            else if (url.match(/\.(mp4|webm|ogv)$/i)) {
                screen.innerHTML = `<video src="${url}#t=${startSeconds}" controls autoplay style="background:#000;"></video>`;
            } 
            else {
                screen.innerHTML = `<iframe src="${url}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
            }
        }

        function closeAppView() {
            document.getElementById('youtube-app').classList.remove('active');
            document.getElementById('twitch-app').classList.remove('active');
            document.getElementById('browser-app').classList.remove('active');
            document.getElementById('dashboard').classList.remove('hidden');
        }

        function showDashboard() {
            closeAppView();
            dbRef.set({ currentUrl: 'home', timestamp: Date.now() });
        }

        // ================= YOUTUBE APP =================
        function openYouTubeApp() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('youtube-app').classList.add('active');
            fetchTrendingYouTube();
        }

        const PIPED_APIS = ['https://pipedapi.kavin.rocks', 'https://api.piped.private.coffee', 'https://pipedapi.mha.fi'];

        function fetchTrendingYouTube() {
            document.getElementById('ytResults').innerHTML = '<div style="color:#aaa;">Cargando populares...</div>';
            tryPipedTrending(0);
        }

        function tryPipedTrending(index) {
            if (index >= PIPED_APIS.length) return;
            fetch(`${PIPED_APIS[index]}/trending?region=US`)
                .then(res => res.json())
                .then(data => renderPipedGrid(data))
                .catch(() => tryPipedTrending(index + 1));
        }

        function searchYouTube() {
            const q = document.getElementById('ytQuery').value.trim();
            if (!q) return;
            document.getElementById('ytResults').innerHTML = '<div style="color:#aaa;">Buscando...</div>';
            tryPipedSearch(q, 0);
        }

        function tryPipedSearch(query, index) {
            if (index >= PIPED_APIS.length) return;
            fetch(`${PIPED_APIS[index]}/search?q=${encodeURIComponent(query)}&filter=videos`)
                .then(res => res.json())
                .then(data => renderPipedGrid(data.items))
                .catch(() => tryPipedSearch(query, index + 1));
        }

        function renderPipedGrid(videos) {
            const resultsContainer = document.getElementById('ytResults');
            resultsContainer.innerHTML = '';
            if (!videos || videos.length === 0) return;

            videos.slice(0, 50).forEach(video => {
                const urlMatch = video.url ? video.url.match(/v=([^&]+)/) : null;
                const videoId = urlMatch ? urlMatch[1] : (video.id || '');
                if (!videoId) return;

                resultsContainer.innerHTML += `
                    <div class="media-card" onclick="playYtVideo('${videoId}')">
                        <img class="media-thumb" src="${video.thumbnail || `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`}" alt="thumb">
                        <div class="media-info">
                            <div class="media-title">${video.title || 'Video'}</div>
                            <div class="media-sub" style="font-size:11px;color:#aaa;">${video.uploaderName || 'YouTube'}</div>
                        </div>
                    </div>
                `;
            });
        }

        function playYtVideo(videoId) {
            dbRef.set({ 
                currentUrl: `https://www.youtube.com/watch?v=${videoId}`,
                timestamp: Date.now()
            });
        }

        // ================= TWITCH APP =================
        function openTwitchApp() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('twitch-app').classList.add('active');
            fallbackTwitchStreams();
        }

        function fallbackTwitchStreams() {
            const popularStreamers = ['auronplay', 'ibai', 'rubius', 'illojuan', 'elxokas', 'tarik', 'gaules', 'shroud', 'kai_cenat', 'fps_shaka'];
            const resultsContainer = document.getElementById('twitchResults');
            resultsContainer.innerHTML = '';

            popularStreamers.forEach(user => {
                resultsContainer.innerHTML += `
                    <div class="media-card" onclick="playTwitchStream('${user}')">
                        <img class="media-thumb" src="https://static-cdn.jtvnw.net/previews-ttv/live_user_${user}-320x180.jpg" onerror="this.src='https://via.placeholder.com/320x180?text=Twitch+Live'">
                        <div class="media-info">
                            <div class="media-title" style="color:#9146ff;">${user}</div>
                            <div class="media-sub" style="font-size:11px;color:#aaa;">En Vivo</div>
                        </div>
                    </div>
                `;
            });
        }

        function searchTwitch() {
            const q = document.getElementById('twitchQuery').value.trim().toLowerCase().replace(/\s+/g, '');
            if (q) playTwitchStream(q);
        }

        function playTwitchStream(channelName) {
            dbRef.set({ 
                currentUrl: `https://www.twitch.tv/${channelName}`,
                timestamp: Date.now()
            });
        }

        // ================= CINE APP (ROJO) =================
        function openMoviesApp() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('youtube-app').classList.add('active');
            document.getElementById('ytQuery').value = 'Peliculas completas en español';
            searchYouTube();
        }

        // ================= BROWSER APP (AZUL) =================
        function openBrowserApp() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('browser-app').classList.add('active');
        }

        function launchWebSearch() {
            let input = document.getElementById('webQuery').value.trim();
            if (!input) return;

            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                if (input.includes('.')) {
                    input = 'https://' + input;
                } else {
                    input = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
                }
            }
            dbRef.set({ 
                currentUrl: input,
                timestamp: Date.now()
            });
        }

        // ================= AUXILIARES =================
        function sendURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (url) {
                dbRef.set({ 
                    currentUrl: url,
                    timestamp: Date.now()
                });
            }
            document.getElementById('urlInput').value = '';
        }

        function toggleHUD() {
            document.getElementById('ui-hud').classList.toggle('hidden');
        }
    </script>
</body>
</html>
