<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SL Universal TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #050505; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
            font-family: 'Poppins', sans-serif; 
            cursor: default;
        }
        
        /* Contenedor general para videos o webframes */
        #media-container { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        #media-container iframe { 
            width: 100% !important; 
            height: 100% !important; 
            position: absolute; 
            top: 0; 
            left: 0; 
            border: none;
        }
        
        #controls { 
            position: absolute; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 10; 
            background: rgba(18, 18, 20, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px; 
            border-radius: 14px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease, transform 0.4s ease;
            transform: translateX(-50%) translateY(10px);
        }

        #controls.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        #controls input { 
            padding: 10px 14px; 
            width: 320px; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(0, 0, 0, 0.5); 
            color: #fff; 
            font-size: 14px; 
            font-family: 'Poppins', sans-serif;
            outline: none; 
        }

        #controls input:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .btn { 
            padding: 10px 16px; 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px; 
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover { 
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            transform: translateY(-1px);
        }

        #playlist-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 15;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 13px;
        }

        #sidebar {
            position: absolute;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(12, 12, 15, 0.92);
            backdrop-filter: blur(16px);
            z-index: 25;
            box-shadow: -10px 0 30px rgba(0,0,0,0.7);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: right 0.4s cubic-bezier(0.1, 1, 0.1, 1);
            padding: 20px;
            box-sizing: border-box;
        }

        #sidebar.open { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
            color: #fff;
        }

        .close-btn { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 20px; cursor: pointer; }

        #queue-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .queue-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            font-size: 12px;
            border: 1px solid transparent;
        }
        .queue-item:hover { background: rgba(255, 255, 255, 0.1); border-color: #3b82f6; }
        .queue-item.active { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }

        #overlay { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 30; 
            background: rgba(5, 5, 5, 0.95); 
            backdrop-filter: blur(8px);
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            text-align: center; 
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="activatePlayer()">
        <h2>Haz clic aquí para activar la Pantalla</h2>
        <p>Habilita el sonido y la reproducción universal</p>
    </div>
    
    <div id="media-container"></div>

    <button id="playlist-toggle" onclick="toggleSidebar()">📺 Cola / Enlaces</button>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3>Elementos en Cola</h3>
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <div id="queue-list"></div>
        <div style="padding-top:15px; border-top:1px solid rgba(255,255,255,0.1);">
            <button class="btn" onclick="clearQueue()" style="width: 100%; background: #ef4444;">Vaciar Cola</button>
        </div>
    </div>

    <div id="controls">
        <input type="text" id="urlInput" placeholder="Pega link de YouTube, Twitch o Web..." />
        <button class="btn" onclick="addToQueue()">Agregar</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sl-tv-sync-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('tv');

        var isActivated = false;
        var currentURL = "";

        function activatePlayer() {
            isActivated = true;
            document.getElementById('overlay').style.display = 'none';
            listenFirebase();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function initUIControls() {
            const controls = document.getElementById('controls');
            let hideTimeout;

            window.addEventListener('mousemove', () => {
                controls.classList.add('visible');
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    if (!controls.matches(':hover')) controls.classList.remove('visible');
                }, 3500);
            });
        }
        initUIControls();

        // Identifica qué tipo de enlace es y devuelve la URL limpia para insertar en el Iframe
        function parseEmbedURL(input) {
            if (!input) return "";
            input = input.trim();

            // Si es YouTube
            let ytMatch = input.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            if (ytMatch && ytMatch[1]) {
                return `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&enablejsapi=1`;
            }

            // Si es Twitch (Canal)
            let twitchMatch = input.match(/twitch\.tv\/([a-zA-Z0-9_]+)/);
            if (twitchMatch && twitchMatch[1]) {
                let domain = window.location.hostname || "localhost";
                return `https://player.twitch.tv/?channel=${twitchMatch[1]}&parent=${domain}&autoplay=true`;
            }

            // Si es una página web cualquiera (ej. SoundCloud, una radio online o web normal)
            if (input.startsWith("http://") || input.startsWith("https://")) {
                return input;
            }

            return "";
        }

        function addToQueue() {
            let val = document.getElementById('urlInput').value;
            let embedUrl = parseEmbedURL(val);

            if (!embedUrl) {
                alert("Enlace no compatible o inválido.");
                return;
            }

            dbRef.once('value', (snapshot) => {
                const data = snapshot.val() || {};
                let playlist = data.playlist || [];
                let currentIndex = data.currentIndex || 0;

                playlist.push(embedUrl);
                let updates = { playlist: playlist };
                if (playlist.length === 1 || currentIndex >= playlist.length) {
                    updates.currentIndex = playlist.length - 1;
                }

                dbRef.update(updates);
                document.getElementById('urlInput').value = "";
            });
        }

        function selectItem(index) {
            dbRef.update({ currentIndex: index });
        }

        function clearQueue() {
            dbRef.set({
                playlist: ['https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1'],
                currentIndex: 0
            });
        }

        function listenFirebase() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || !isActivated) return;

                const playlist = data.playlist || [];
                const currentIndex = data.currentIndex || 0;

                // Renderizar menú lateral
                const listEl = document.getElementById('queue-list');
                listEl.innerHTML = "";

                playlist.forEach((url, idx) => {
                    let div = document.createElement('div');
                    div.className = `queue-item ${idx === currentIndex ? 'active' : ''}`;
                    div.onclick = () => selectItem(idx);
                    div.innerHTML = `<b>#${idx + 1}</b><br><span style="word-break:break-all;">${url}</span>`;
                    listEl.appendChild(div);
                });

                if (playlist.length === 0) return;

                const targetURL = playlist[currentIndex];
                if (targetURL && targetURL !== currentURL) {
                    currentURL = targetURL;
                    document.getElementById('media-container').innerHTML = `<iframe src="${currentURL}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
                }
            });
        }
    </script>
</body>
</html>
