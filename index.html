<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SL YouTube Sync TV - Playlist Visual</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #050505; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
            font-family: 'Poppins', sans-serif; 
            cursor: default;
        }
        
        #player { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        #player iframe { 
            width: 100% !important; 
            height: 100% !important; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }
        
        /* Panel de control inferior (Buscador) */
        #controls { 
            position: absolute; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 10; 
            background: rgba(18, 18, 20, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px; 
            border-radius: 14px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease, transform 0.4s ease;
            transform: translateX(-50%) translateY(10px);
        }

        #controls.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        #controls input { 
            padding: 10px 14px; 
            width: 260px; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(0, 0, 0, 0.5); 
            color: #fff; 
            font-size: 14px; 
            font-family: 'Poppins', sans-serif;
            outline: none; 
        }

        #controls input:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        #controls input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn { 
            padding: 10px 16px; 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px; 
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover { 
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            transform: translateY(-1px);
        }

        /* Botón flotante para abrir/cerrar la Playlist lateral */
        #playlist-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 15;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        #playlist-toggle:hover {
            background: rgba(40, 40, 45, 0.95);
        }

        /* Panel Lateral de Playlist (Sidebar) */
        #sidebar {
            position: absolute;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(12, 12, 15, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 25;
            box-shadow: -10px 0 30px rgba(0,0,0,0.7);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: right 0.4s cubic-bezier(0.1, 1, 0.1, 1);
            padding: 20px;
            box-sizing: border-box;
        }

        #sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .sidebar-header h3 {
            margin: 0;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 20px;
            cursor: pointer;
        }
        .close-btn:hover { color: #fff; }

        /* Lista de elementos en la cola */
        #queue-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        #queue-list::-webkit-scrollbar {
            width: 6px;
        }
        #queue-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .queue-item {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .queue-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .queue-item.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
        }

        .queue-item img {
            width: 75px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
        }

        .queue-item-info {
            font-size: 12px;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .sidebar-footer {
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        /* Overlay inicial */
        #overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 30; 
            background: rgba(5, 5, 5, 0.95); 
            backdrop-filter: blur(8px);
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            text-align: center; 
            font-family: 'Poppins', sans-serif;
        }

        #overlay h2 { margin: 0 0 8px 0; font-weight: 600; font-size: 26px; }
        #overlay p { color: rgba(255, 255, 255, 0.6); font-size: 14px; margin: 0; }
    </style>
</head>
<body>

    <div id="overlay" onclick="activatePlayer()">
        <h2>Haz clic aquí para activar la TV</h2>
        <p>Habilita el sonido y la lista de reproducción interactiva</p>
    </div>
    
    <div id="player"></div>

    <!-- Botón superior para abrir la playlist -->
    <button id="playlist-toggle" onclick="toggleSidebar()">📺 Ver Cola</button>

    <!-- Panel lateral deslizante -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h3>Lista de Reproducción</h3>
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <div id="queue-list">
            <!-- Los videos cargados aparecerán aquí dinámicamente -->
        </div>
        <div class="sidebar-footer">
            <button class="btn" onclick="clearQueue()" style="width: 100%; background: linear-gradient(135deg, #ef4444, #b91c1c);">Vaciar Cola</button>
        </div>
    </div>

    <!-- Controles inferiores (Buscador) -->
    <div id="controls">
        <input type="text" id="videoInput" placeholder="Pega link o ID de YouTube..." />
        <button class="btn" onclick="addToQueue()">Agregar</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sl-tv-sync-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('tv');

        var player;
        var isReady = false;
        var currentVideoID = "";
        var hideTimeout;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'dQw4w9WgXcQ',
                playerVars: { 'autoplay': 1, 'controls': 0, 'rel': 0, 'enablejsapi': 1 },
                events: { 
                    'onReady': function() { 
                        isReady = true; 
                        player.mute(); 
                        listenFirebase(); 
                        initUIControls();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function activatePlayer() {
            document.getElementById('overlay').style.display = 'none';
            if (player) { 
                player.unMute(); 
                player.setVolume(100); 
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                dbRef.once('value', (snapshot) => {
                    const data = snapshot.val();
                    if (!data || !data.playlist) return;

                    let playlist = data.playlist;
                    let currentIndex = data.currentIndex || 0;

                    if (currentIndex + 1 < playlist.length) {
                        dbRef.update({ currentIndex: currentIndex + 1 });
                    }
                });
            }
        }

        function initUIControls() {
            const controls = document.getElementById('controls');

            function showControls() {
                controls.classList.add('visible');
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    if (!controls.matches(':hover')) {
                        controls.classList.remove('visible');
                    }
                }, 3500);
            }

            window.addEventListener('mousemove', showControls);
            controls.addEventListener('mouseenter', () => clearTimeout(hideTimeout));
            controls.addEventListener('mouseleave', () => {
                hideTimeout = setTimeout(() => controls.classList.remove('visible'), 2000);
            });
        }

        function extractYouTubeID(url) {
            if (!url) return "";
            url = url.trim();
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : (url.length == 11 ? url : "");
        }

        function addToQueue() {
            let inputVal = document.getElementById('videoInput').value;
            let videoId = extractYouTubeID(inputVal);
            
            if (!videoId) {
                alert("Por favor, ingresa un enlace o ID de YouTube válido.");
                return;
            }

            dbRef.once('value', (snapshot) => {
                const data = snapshot.val() || {};
                let playlist = data.playlist || [];
                let currentIndex = data.currentIndex || 0;

                playlist.push(videoId);

                let updates = { playlist: playlist };
                if (playlist.length === 1 || currentIndex >= playlist.length) {
                    updates.currentIndex = playlist.length - 1;
                }

                dbRef.update(updates);
                document.getElementById('videoInput').value = "";
            });
        }

        // Seleccionar y reproducir directamente un video de la lista al hacer clic
        function selectVideo(index) {
            dbRef.update({ currentIndex: index });
        }

        function clearQueue() {
            dbRef.set({
                playlist: ['dQw4w9WgXcQ'],
                currentIndex: 0
            });
        }

        function listenFirebase() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || !isReady) return;

                const playlist = data.playlist || [];
                const currentIndex = data.currentIndex || 0;

                // Renderizar la lista lateral con miniaturas
                const queueListEl = document.getElementById('queue-list');
                queueListEl.innerHTML = "";

                playlist.forEach((id, index) => {
                    let itemDiv = document.createElement('div');
                    itemDiv.className = `queue-item ${index === currentIndex ? 'active' : ''}`;
                    itemDiv.onclick = () => selectVideo(index);
                    
                    let thumbUrl = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
                    
                    itemDiv.innerHTML = `
                        <img src="${thumbUrl}" alt="Thumbnail">
                        <div class="queue-item-info">
                            <b>#${index + 1}</b><br>
                            ID: ${id}
                        </div>
                    `;
                    queueListEl.appendChild(itemDiv);
                });

                if (playlist.length === 0) return;

                const targetVideoID = playlist[currentIndex];
                if (targetVideoID && targetVideoID !== currentVideoID) {
                    currentVideoID = targetVideoID;
                    player.loadVideoById(currentVideoID);
                }
            });
        }
    </script>
</body>
</html>
