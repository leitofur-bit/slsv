<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SL YouTube Sync TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #050505; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
            font-family: 'Poppins', sans-serif; 
            cursor: default;
        }
        
        #player { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        #player iframe { 
            width: 100% !important; 
            height: 100% !important; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }
        
        /* Panel de control con efecto auto-ocultable */
        #controls { 
            position: absolute; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 10; 
            background: rgba(18, 18, 20, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px; 
            border-radius: 14px; 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            
            /* Animación de ocultado suave */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease, transform 0.4s ease;
            transform: translateX(-50%) translateY(10px);
        }

        /* Cuando la clase 'visible' está activa, la barra aparece */
        #controls.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        #controls input { 
            padding: 10px 14px; 
            width: 320px; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(0, 0, 0, 0.5); 
            color: #fff; 
            font-size: 14px; 
            font-family: 'Poppins', sans-serif;
            outline: none; 
        }

        #controls input:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        #controls input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #controls button { 
            padding: 10px 20px; 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px; 
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }

        #controls button:hover { 
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            transform: translateY(-1px);
        }

        /* Overlay inicial */
        #overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 20; 
            background: rgba(5, 5, 5, 0.95); 
            backdrop-filter: blur(8px);
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            text-align: center; 
            font-family: 'Poppins', sans-serif;
        }

        #overlay h2 { margin: 0 0 8px 0; font-weight: 600; font-size: 26px; }
        #overlay p { color: rgba(255, 255, 255, 0.6); font-size: 14px; margin: 0; }
    </style>
</head>
<body>

    <div id="overlay" onclick="activatePlayer()">
        <h2>Haz clic aquí para activar la TV</h2>
        <p>Habilita el sonido y los controles inteligentes</p>
    </div>
    
    <div id="player"></div>

    <div id="controls">
        <input type="text" id="videoInput" placeholder="Pega link o ID de YouTube..." />
        <button onclick="changeVideo()">Reproducir</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sl-tv-sync-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('tv');

        var player;
        var isReady = false;
        var currentVideoID = "";
        var hideTimeout;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'dQw4w9WgXcQ',
                playerVars: { 'autoplay': 1, 'controls': 0, 'rel': 0, 'enablejsapi': 1 },
                events: { 
                    'onReady': function() { 
                        isReady = true; 
                        player.mute(); 
                        listenFirebase(); 
                        initUIControls();
                    } 
                }
            });
        }

        function activatePlayer() {
            document.getElementById('overlay').style.display = 'none';
            if (player) { 
                player.unMute(); 
                player.setVolume(100); 
            }
        }

        // Sistema para mostrar la barra al mover el mouse y ocultarla tras 3 segundos de inactividad
        function initUIControls() {
            const controls = document.getElementById('controls');

            function showControls() {
                controls.classList.add('visible');
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    // Si el mouse no está encima del input o botón, se oculta
                    if (!controls.matches(':hover')) {
                        controls.classList.remove('visible');
                    }
                }, 3000); // Se oculta tras 3 segundos
            }

            window.addEventListener('mousemove', showControls);
            controls.addEventListener('mouseenter', () => clearTimeout(hideTimeout));
            controls.addEventListener('mouseleave', () => {
                hideTimeout = setTimeout(() => controls.classList.remove('visible'), 2000);
            });
        }

        function extractYouTubeID(url) {
            if (!url) return "";
            url = url.trim();
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : (url.length == 11 ? url : "");
        }

        function changeVideo() {
            let inputVal = document.getElementById('videoInput').value;
            let videoId = extractYouTubeID(inputVal);
            
            if (!videoId) {
                alert("Por favor, ingresa un enlace o ID de YouTube válido.");
                return;
            }

            let serverTime = Math.floor(Date.now() / 1000);
            
            dbRef.set({
                videoId: videoId,
                startTime: serverTime,
                paused: false
            });

            document.getElementById('videoInput').value = "";
        }

        function listenFirebase() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || !isReady) return;

                const serverTime = Math.floor(Date.now() / 1000);
                const targetTime = serverTime - data.startTime;

                if (data.videoId && data.videoId !== currentVideoID) {
                    currentVideoID = data.videoId;
                    player.loadVideoById(currentVideoID, targetTime);
                    return;
                }

                if (data.paused) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }

                let actualTime = player.getCurrentTime();
                if (Math.abs(actualTime - targetTime) > 2.0) {
                    player.seekTo(targetTime, true);
                }
            });
        }
    </script>
</body>
</html>
