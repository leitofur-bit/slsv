<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Smart TV - Media Dashboard</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: radial-gradient(circle at center, #1a1c29 0%, #08090d 100%); font-family: 'Segoe UI', Arial, sans-serif; color: white; overflow: hidden; }

        /* HEADER / BARRA SUPERIOR */
        .top-bar { position: absolute; top: 0; left: 0; width: 100%; padding: 25px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 20; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 2px; color: #fff; }
        .logo span { color: #ff3b30; }
        .top-right { display: flex; align-items: center; gap: 20px; font-size: 16px; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* MAIN DASHBOARD */
        #dashboard { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 80px 50px 40px 50px; z-index: 10; transition: opacity 0.5s, transform 0.5s; }
        #dashboard.hidden { opacity: 0; pointer-events: none; transform: scale(0.95); }

        .app-grid { display: flex; gap: 25px; align-items: center; margin-top: 20px; }

        /* CARD GRANDE (RSS / NOTICIAS) */
        .news-card { width: 320px; height: 200px; background: #222 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600') center/cover; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: pointer; }
        .news-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
        .news-card * { position: relative; z-index: 2; }
        .badge { background: #ff9500; color: #000; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; align-self: flex-start; margin-bottom: 8px; text-transform: uppercase; }
        .news-title { font-size: 15px; font-weight: 700; line-height: 1.3; }

        /* ICONOS DE APPS (ESTILO APPLE TV) */
        .app-card { width: 160px; height: 200px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 10px 20px rgba(0,0,0,0.4); position: relative; border: 2px solid transparent; }
        .app-card img { width: 80px; height: 80px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
        
        /* EFECTO HOVER ELEGANTE (ANIMACIÓN DE ELEVACIÓN Y BRILLO) */
        .app-card:hover, .news-card:hover { transform: translateY(-12px) scale(1.05); box-shadow: 0 20px 35px rgba(0,0,0,0.6), 0 0 25px rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.8); }

        /* COLORES INDIVIDUALES */
        .bg-youtube { background: linear-gradient(135deg, #ff0000, #990000); }
        .bg-twitch { background: linear-gradient(135deg, #9146ff, #4b1b96); }
        .bg-browser { background: linear-gradient(135deg, #007aff, #004080); }
        .bg-movies { background: linear-gradient(135deg, #ff2d55, #8e001a); }

        /* BARRA INFERIOR DE MENÚ */
        .bottom-nav { margin-top: 40px; display: flex; gap: 15px; }
        .nav-btn { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 12px 28px; border-radius: 30px; font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .nav-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }

        /* REPRODUCTOR Y CONTAINER FULLSCREEN */
        #media-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #000; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
        #media-screen.active { opacity: 1; pointer-events: auto; }

        /* CONTROLES / HUD OVERLAY */
        #ui-hud { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); z-index: 30; transition: transform 0.3s; display: flex; gap: 10px; align-items: center; }
        #ui-hud.hidden { transform: translateY(100%); }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: none; background: rgba(255,255,255,0.15); color: white; font-size: 14px; outline: none; }
        .btn-act { padding: 12px 20px; border-radius: 8px; border: none; background: #007aff; color: white; font-weight: bold; cursor: pointer; }
        
        /* OVERLAY INICIAL DE INTERACCIÓN */
        #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; font-weight: bold; }
        #start-overlay.hidden { display: none; }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="initApp()"> Haz clic para Encender la TV</div>

    <!-- BARRA SUPERIOR (HEADER) -->
    <div class="top-bar">
        <div class="logo">MEDIA<span>SL</span></div>
        <div class="top-right">
            <span id="channelNameDisplay">Canal: ...</span>
            <span id="clockDisplay">00:00 PM</span>
        </div>
    </div>

    <!-- LAUNCHER / DASHBOARD ESTILO SMART TV -->
    <div id="dashboard">
        <div class="app-grid">
            <!-- TARJETA NOTICIAS / RSS -->
            <div class="news-card">
                <span class="badge">Novedades SL</span>
                <div class="news-title">Bienvenido a MediaSL Smart TV System</div>
            </div>

            <!-- APPS -->
            <div class="app-card bg-youtube" onclick="openApp('youtube')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube">
            </div>

            <div class="app-card bg-twitch" onclick="openApp('twitch')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Twitch_Glitch_Logo_Purple.svg" alt="Twitch">
            </div>

            <div class="app-card bg-movies" onclick="openApp('movies')">
                <img src="https://cdn-icons-png.flaticon.com/512/3172/3172520.png" alt="Peliculas">
            </div>

            <div class="app-card bg-browser" onclick="openApp('browser')">
                <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" alt="Browser">
            </div>
        </div>

        <!-- BARRA INFERIOR -->
        <div class="bottom-nav">
            <div class="nav-btn" onclick="showDashboard()">INICIO</div>
            <div class="nav-btn" onclick="toggleHUD()">HUD CONTROLES</div>
        </div>
    </div>

    <!-- PANTALLA DE REPRODUCCIÓN (FULLSCREEN) -->
    <div id="media-screen"></div>

    <!-- HUD DE CONTROL (OCULTO POR DEFECTO) -->
    <div id="ui-hud" class="hidden">
        <input type="text" id="urlInput" placeholder="Pega URL de YouTube, Twitch, .mp4 o película...">
        <button class="btn-act" onclick="sendURL()">Reproducir</button>
        <button class="btn-act" style="background: #34c759;" onclick="showDashboard()">Ir al Menú</button>
    </div>

<script>
// FIREBASE CONFIG
const firebaseConfig = { databaseURL: "https://sl-tv-sync-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);

const channel = new URLSearchParams(window.location.search).get('channel') || 'canal_default';
document.getElementById('channelNameDisplay').innerText = `Canal: ${channel}`;
const dbRef = firebase.database().ref(channel);

let ytPlayer, currentMedia = null, activeApp = 'home';

function initApp() {
    document.getElementById('start-overlay').classList.add('hidden');
    updateClock();
    setInterval(updateClock, 1000);
    
    // Inicializa el reproductor YouTube embebido
    ytPlayer = new YT.Player('media-screen', {
        height: '100%', width: '100%', videoId: '',
        playerVars: { 'autoplay': 1, 'controls': 1 },
        events: { 'onReady': () => listenFirebase() }
    });
}

function updateClock() {
    const now = new Date();
    document.getElementById('clockDisplay').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function listenFirebase() {
    dbRef.on('value', snap => {
        const data = snap.val();
        if (!data || !data.currentUrl) return;
        
        if (data.currentUrl !== currentMedia) {
            currentMedia = data.currentUrl;
            loadURL(data.currentUrl);
        }
    });
}

function loadURL(url) {
    const screen = document.getElementById('media-screen');
    const dashboard = document.getElementById('dashboard');

    if (!url || url === 'home') {
        showDashboard();
        return;
    }

    dashboard.classList.add('hidden');
    screen.classList.add('active');

    // Detección de plataforma
    if (url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/)) {
        if (ytPlayer && ytPlayer.loadVideoById) ytPlayer.loadVideoById(RegExp.$1);
    } else if (url.match(/\.(mp4|webm|ogv)$/i)) {
        screen.innerHTML = `<video src="${url}" width="100%" height="100%" controls autoplay style="background:#000;"></video>`;
    } else {
        // Embed libre con permisos completos para cualquier sitio web / película
        screen.innerHTML = `<iframe src="${url}" width="100%" height="100%" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen style="border:none;"></iframe>`;
    }
}

function sendURL() {
    const url = document.getElementById('urlInput').value.trim();
    if (url) dbRef.update({ currentUrl: url });
    document.getElementById('urlInput').value = '';
}

function openApp(appName) {
    if (appName === 'youtube') dbRef.update({ currentUrl: 'https://www.youtube.com' });
    else if (appName === 'twitch') dbRef.update({ currentUrl: 'https://www.twitch.tv' });
    else if (appName === 'browser') toggleHUD();
    else if (appName === 'movies') toggleHUD();
}

function showDashboard() {
    dbRef.update({ currentUrl: 'home' });
    document.getElementById('media-screen').classList.remove('active');
    document.getElementById('dashboard').classList.remove('hidden');
}

function toggleHUD() {
    document.getElementById('ui-hud').classList.toggle('hidden');
}
</script>
</body>
</html>
