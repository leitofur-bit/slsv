<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SL YouTube Sync TV</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: Arial, sans-serif; }
        #player { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #player iframe { width: 100% !important; height: 100% !important; position: absolute; top: 0; left: 0; }
        
        /* Panel de control flotante integrado en la pantalla */
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(0, 0, 0, 0.8); padding: 10px 20px; border-radius: 8px; display: flex; gap: 10px; align-items: center; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #controls input { padding: 8px 12px; width: 300px; border-radius: 4px; border: none; background: #222; color: #fff; font-size: 14px; outline: none; }
        #controls button { padding: 8px 16px; background: #cc0000; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        #controls button:hover { background: #ff0000; }

        /* Overlay inicial obligatorio para desbloquear el audio en el visor */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; background: rgba(0,0,0,0.95); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; }
        h2 { margin: 0 0 10px 0; }
    </style>
</head>
<body>

    <div id="overlay" onclick="activatePlayer()">
        <h2>Haz clic aquí para activar la TV</h2>
        <p>Esto habilitará el sonido y el buscador integrado en pantalla</p>
    </div>
    
    <div id="player"></div>

    <!-- Buscador integrado directamente en la interfaz -->
    <div id="controls">
        <input type="text" id="videoInput" placeholder="Pega link o ID de YouTube aquí..." />
        <button onclick="changeVideo()">Reproducir</button>
    </div>

    <!-- Firebase y YouTube APIs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sl-tv-sync-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('tv');

        var player;
        var isReady = false;
        var currentVideoID = "";

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'dQw4w9WgXcQ',
                playerVars: { 'autoplay': 1, 'controls': 0, 'rel': 0, 'enablejsapi': 1 },
                events: { 
                    'onReady': function() { 
                        isReady = true; 
                        player.mute(); 
                        listenFirebase(); 
                    } 
                }
            });
        }

        function activatePlayer() {
            document.getElementById('overlay').style.display = 'none';
            if (player) { 
                player.unMute(); 
                player.setVolume(100); 
            }
        }

        // Limpiador automático: extrae la ID ya sea que pegues el link completo o solo el código
        function extractYouTubeID(url) {
            if (!url) return "";
            url = url.trim();
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : (url.length == 11 ? url : "");
        }

        function changeVideo() {
            let inputVal = document.getElementById('videoInput').value;
            let videoId = extractYouTubeID(inputVal);
            
            if (!videoId) {
                alert("Por favor, ingresa un enlace o ID de YouTube válido.");
                return;
            }

            let serverTime = Math.floor(Date.now() / 1000);
            
            // Envía la orden directamente a Firebase desde la pantalla web
            dbRef.set({
                videoId: videoId,
                startTime: serverTime,
                paused: false
            });

            document.getElementById('videoInput').value = "";
        }

        function listenFirebase() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || !isReady) return;

                const serverTime = Math.floor(Date.now() / 1000);
                const targetTime = serverTime - data.startTime;

                if (data.videoId && data.videoId !== currentVideoID) {
                    currentVideoID = data.videoId;
                    player.loadVideoById(currentVideoID, targetTime);
                    return;
                }

                if (data.paused) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }

                let actualTime = player.getCurrentTime();
                if (Math.abs(actualTime - targetTime) > 2.0) {
                    player.seekTo(targetTime, true);
                }
            });
        }
    </script>
</body>
</html>
